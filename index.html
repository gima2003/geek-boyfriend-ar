<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Geek Boyfriend | Episode 18 AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; height:100%; width:100%; overflow:hidden; background:#08111d; }
    #experience { position:fixed; inset:0; overflow:hidden; }
    #experience a-scene { width:100%; height:100%; }
    #hud { position:fixed; z-index:10; top:14px; left:14px; right:14px;
           padding:12px 14px; border-radius:14px; background:rgba(7,12,24,.76);
           color:#fff0e7; font:14px/1.5 system-ui, sans-serif; pointer-events:none; }
    #hud strong { color:#ffc5cd; display:block; font-size:16px; }
    #credit { position:fixed; bottom:14px; left:14px; right:14px; z-index:10;
           color:#eee; text-align:center; font:12px system-ui,sans-serif;
           text-shadow:0 1px 5px #000; pointer-events:none; }
  </style>
</head>
<body>
  <div id="experience">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="chapter-target" mindar-image-target="targetIndex: 0">
        <!-- Everything inside this entity stays attached to the tracked page. -->
        <!-- Floating moon: positive z makes the object stand above the page. -->
        <a-sphere position="0 0 0.18" radius="0.15"
          material="color:#e9dbca; roughness:1; emissive:#625a63; emissiveIntensity:0.12"
          animation="property: position; from: 0 0 0.15; to: 0 0 0.24; dur: 2300; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>
        <!-- A fine orbital ring. -->
        <a-ring position="0 0 0.07" radius-inner="0.315" radius-outer="0.32"
          material="color:#f3a8bf; side:double; opacity:0.8; transparent:true"></a-ring>
        <!-- Satellite circling the moon in the tracked page plane. -->
        <a-entity position="0 0 0.13"
          animation="property: rotation; to: 0 0 360; dur: 9500; loop: true; easing: linear">
          <a-entity position="0.315 0 0.09">
            <a-box width="0.065" height="0.04" depth="0.05" color="#ffd3b9"></a-box>
            <a-box position="-0.105 0 0" width="0.13" height="0.065" depth="0.01" color="#3e85b4"></a-box>
            <a-box position="0.105 0 0" width="0.13" height="0.065" depth="0.01" color="#3e85b4"></a-box>
          </a-entity>
        </a-entity>
        <!-- Twinkling stars (simple 3D objects, no Blender required). -->
        <a-octahedron position="-0.35 0.27 0.12" radius="0.055" color="#ffd99b"
          animation="property: scale; from: .6 .6 .6; to: 1.25 1.25 1.25; dur: 1300; dir:alternate; loop:true"></a-octahedron>
        <a-octahedron position="0.32 0.37 0.06" radius="0.045" color="#ffd3e3"
          animation="property: scale; from: 1 1 1; to: .35 .35 .35; dur: 1700; dir:alternate; loop:true"></a-octahedron>
        <a-octahedron position="-0.24 -0.33 0.09" radius="0.035" color="#c5e6ff"
          animation="property: scale; from: .5 .5 .5; to: 1.4 1.4 1.4; dur: 1100; dir:alternate; loop:true"></a-octahedron>
        <a-octahedron position="0.32 -0.26 0.1" radius="0.035" color="#ffc9db"
          animation="property: scale; from: 1 1 1; to: .45 .45 .45; dur: 1900; dir:alternate; loop:true"></a-octahedron>
      </a-entity>
    </a-scene>
  </div>
  <div id="hud"><strong>GEEK BOYFRIEND · EPISODE 18</strong><span id="status">Allow camera access, then point at the tracking picture.</span></div>
  <div id="credit">Keep the illustration flat and well lit · Move the phone slowly</div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const marker = document.getElementById('chapter-target');
      const status = document.getElementById('status');
      marker.addEventListener('targetFound', () => {
        status.textContent = 'Found! Move your phone to explore the 3D scene.';
      });
      marker.addEventListener('targetLost', () => {
        status.textContent = 'Page lost. Point the camera at the artwork again.';
      });
    });
  </script>
</body>
</html>
